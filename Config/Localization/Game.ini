; Localization target of the game (D245, front-end step 5): French is the source language, English and Japanese the
; translations (.po files next to the archives, written by hand). Every displayed text goes through FText (LOCTEXT).
; Gather, import the .po files, compile the .locres and export the .po files again (the editor quits when done):
;   UnrealEditor-Cmd.exe <project> -run=GatherText -config=<project>\Config\Localization\Game.ini -unattended -nop4 -nosplash
[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
ResourceName=Game.locres
NativeCulture=fr
CulturesToGenerate=fr
CulturesToGenerate=en
CulturesToGenerate=ja

; Texts of the code (LOCTEXT, NSLOCTEXT) of both modules, and of the scripts (NSLOCTEXT of Angelscript, J8a.5: string
; literals only, read as C++ by the gatherer)
[GatherTextStep0]
CommandletClass=GatherTextFromSource
SearchDirectoryPaths=Source/
SearchDirectoryPaths=Script/
ExcludePathFilters=*/Tests/*
FileNameFilters=*.cpp
FileNameFilters=*.h
FileNameFilters=*.as
ShouldGatherFromEditorOnlyData=false

[GatherTextStep1]
CommandletClass=GenerateGatherManifest

[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

; Translations written in the .po files
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

; .po files brought up to date with the gathered texts, for the next translation pass
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true
