
[/Script/EngineSettings.GeneralProjectSettings]
ProjectID=795773E54351EA4A0A5DC19B082ECFF0

[/Script/MyCrusader.MCSimulationSettings]
; D217: fixed step at 20 Hz. D219: processors run at the fixed step (disabled in Mass phases by DefaultMass.ini).
; D220: avoidance (the whole cost at 2 000 units, walking as well as standing) only runs one step out of 6.
SimulationRateHz=20
MaxStepsPerFrame=4
+ThrottledProcessors=/Script/MassNavigation.MassMovingAvoidanceProcessor
+ThrottledProcessors=/Script/MassNavigation.MassStandingAvoidanceProcessor
ThrottledProcessorStepInterval=6
; D221/D227: one row per unit type, imported from Tools/Data/UnitTypes.csv by Tools/Editor/make_unit_types.py.
UnitTypesTable=/Game/Units/UnitTypes.UnitTypes
; D224: units created per step at most (0 = no budget); a stress test lifts it with mc.Units.SpawnBudget -1.
MaxUnitBirthsPerStep=500
; D226/D228: distance (cm) under which a unit reached the goal of its order, and extent (cm) within which the
; destination of an order is looked for on the navmesh.
OrderArrivalTolerance=50
OrderTargetProjectionExtent=1000
; D230: the avoidance solver keeps its cadence (D220) but its last impulse is re-applied for 5 steps, which is
; what separates the units of a crowd (S2 overlapping pairs 137 -> 58, 2 000 units, measured 2026-10-11).
AvoidanceHoldSteps=5
AvoidanceHoldDecay=1.0
; M1 core, in pipeline order: previous transforms, orders (D226), Mass movement. Births and destructions are
; not processors: they need the synchronous entity API, forbidden during a processor (D224), and run at the
; head and the tail of the step in UMCSimulationSubsystem.
+SimulationProcessors=/Script/MyCrusader.MCStorePreviousTransformProcessor
+SimulationProcessors=/Script/MyCrusader.MCUnitOrderProcessor
+SimulationProcessors=/Script/MassNavMeshNavigation.MassNavMeshPathFollowProcessor
+SimulationProcessors=/Script/MassNavMeshNavigation.MassNavMeshNavigationBoundaryProcessor
+SimulationProcessors=/Script/MassNavigation.MassSteerToMoveTargetProcessor
+SimulationProcessors=/Script/MyCrusader.MCAvoidanceSnapshotProcessor
+SimulationProcessors=/Script/MassNavigation.MassMovingAvoidanceProcessor
+SimulationProcessors=/Script/MassNavigation.MassStandingAvoidanceProcessor
+SimulationProcessors=/Script/MyCrusader.MCAvoidanceHoldProcessor
+SimulationProcessors=/Script/MassMovement.MassApplyForceProcessor
+SimulationProcessors=/Script/MassMovement.MassApplyMovementProcessor
+SimulationProcessors=/Script/MassNavigation.MassNavigationSmoothHeightProcessor
+SimulationProcessors=/Script/MassNavigation.MassSmoothOrientationProcessor
+SimulationProcessors=/Script/MassNavigation.MassNavigationObstacleGridProcessor
