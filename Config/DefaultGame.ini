[/Script/HeroesOfLiberty.HOLBuildingSettings]
; D260: one row per building type, imported from Tools/Data/BuildingTypes.csv by Tools/Editor/make_building_types.py.
BuildingTypesTable=/Game/Buildings/BuildingTypes.BuildingTypes
; D310 (J6a.1): gap (cm) every unit's body keeps from a footprint, the same for every building: the navmesh's forbidden
; area is the footprint widened by it (then by the agent's radius, 60 cm); a body pushed into a footprint is put back out.
BodyClearance=25
; D324 (J6b.2b, the user's rule of 2026-10-17): a building occupies its tiles (placement, overlaps, map, anti-rush), but
; the building itself, its body, is inset this far (cm) on every side of them, whatever its size: its shape, its selection
; frame, the navmesh's forbidden area (body + BodyClearance + agent), the footprints' guard, the builders' and deposits'
; spots. Two neighbours whose tiles touch leave 2 x BodyInset between them: one Peasant (1.2 m wide) passes, not two abreast.
; 105 rather than the ~90 asked: at 90 (1.8 m) the navmesh's forbidden areas (body + 25 + 60 cm, rounded up to its voxels:
; 87 to 102 cm measured) closed the way; at 105 (2.1 m) a strip stays open, still too narrow for two abreast (2.4 m).
BodyInset=115
; D324 refined (the user's rule of 2026-10-17): what is seen of a building fills at least 90 % of its tiles; its visible
; shape is inset this far (cm) on every side: shape, slab and rising site, ghosts, selection frame, click. 30: houses and
; camps 5.4 m of 6 (90 %), main centre 11.4 m of 12 (95 %). The body (BodyInset) still blocks: Peasants walk a little
; into the shape, one at a time between two neighbours.
VisualInset=30
; D311 (J6a.2), 4 m since D344 (the user's choice of 2026-10-22, 3 m before): side of a tile (cm), the placement grid:
; footprints are whole tiles (main centre 4 x 4 = 16 m, houses and camps 2 x 2 = 8 m), their corners on the grid, the main centres too; anti-rush radius (cm, D22) from an enemy main centre's
; middle to the nearest point of a footprint (indicative, to tune in test).
TileSize=400
AntiRushRadius=4000
; D312 (J6a.2): N builders work N^BuilderExponent times as fast as one (0.63 = ln 2 / ln 3: 3 builders twice as fast).
BuilderExponent=0.63

