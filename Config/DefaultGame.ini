[/Script/HeroesOfLiberty.HOLSimulationSettings]
; D217: fixed step at 20 Hz. D219: processors run at the fixed step (disabled in Mass phases by DefaultMass.ini).
; D220: avoidance (the whole cost at 2 000 units, walking as well as standing) only runs one step out of 6; the
; moving one is throttled as its parent class, run in parallel (D302), the standing one too, its neighbours found in
; parallel (J7c.4).
SimulationRateHz=20
MaxStepsPerFrame=4
+ThrottledProcessors=/Script/MassNavigation.MassMovingAvoidanceProcessor
+ThrottledProcessors=/Script/MassNavigation.MassStandingAvoidanceProcessor
ThrottledProcessorStepInterval=6
; D221/D227: one row per unit type, imported from Tools/Data/UnitTypes.csv by Tools/Editor/make_unit_types.py.
UnitTypesTable=/Game/Units/UnitTypes.UnitTypes
; D224: units created per step at most (0 = no budget); a stress test lifts it with hol.Units.SpawnBudget -1.
MaxUnitBirthsPerStep=500
; D226/D228: distance (cm) under which a unit reached the goal of its order, and extent (cm) within which the
; destination of an order is looked for on the navmesh. D290: the last step lands on the slot (UHOLFullSpeedProcessor),
; so the tolerance only absorbs rounding; at 50 cm a unit stopped short of its slot.
OrderArrivalTolerance=5
OrderTargetProjectionExtent=1000
; D230: the avoidance solver keeps its cadence (D220) but its last impulse is re-applied on the 5 following steps,
; capped at the type's MaxAcceleration, which is what separates the units of a crowd: S2 overlapping pairs 102 -> 68
; with it against 173 -> 120 without (2 000 units, fixed seed, step-driven runs, 2026-10-12). The figure first
; given here, 137 -> 58, compared two unrepeatable runs measured with a faulty hold (applied twice, then 4 steps).
AvoidanceHoldSteps=5
AvoidanceHoldDecay=1.0
; M1 core, in pipeline order: previous transforms, orders (D226), gathering (J5, D296: its walks are move orders of the
; queue, applied at the next step), Mass movement. D302: Mass' moving avoidance and steering (J7c.4: standing avoidance too)
; run their chunks in parallel (HOLParallel*Processor, the same results); the orientation is instant (D304). Births and destructions are
; not processors: they need the synchronous entity API, forbidden during a processor (D224), and run at the
; head and the tail of the step in UHOLSimulationSubsystem.
+SimulationProcessors=/Script/HeroesOfLiberty.HOLStorePreviousTransformProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLUnitOrderProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLGatherProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLBuildProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLCombatProcessor
+SimulationProcessors=/Script/MassNavMeshNavigation.MassNavMeshPathFollowProcessor
+SimulationProcessors=/Script/MassNavMeshNavigation.MassNavMeshNavigationBoundaryProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLParallelSteerToMoveTargetProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLAvoidanceSnapshotProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLParallelMovingAvoidanceProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLParallelStandingAvoidanceProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLAvoidanceHoldProcessor
+SimulationProcessors=/Script/MassMovement.MassApplyForceProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLFullSpeedProcessor
+SimulationProcessors=/Script/MassMovement.MassApplyMovementProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLUnitSeparationProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLFootprintKeepOutProcessor
+SimulationProcessors=/Script/MassNavigation.MassNavigationSmoothHeightProcessor
+SimulationProcessors=/Script/HeroesOfLiberty.HOLInstantOrientationProcessor
+SimulationProcessors=/Script/MassNavigation.MassNavigationObstacleGridProcessor

